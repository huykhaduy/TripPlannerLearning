# Postgres:
#   Required — the app has no other database. `docker compose up -d`, then set
#   ConnectionStrings__Postgres in your .env (see .env.example; defaults here
#   match it). Migrations apply automatically on startup via ApplyMigrationsAsync
#   in Program.cs.
#
# Redis:
#   Optional — the in-process cache remains the zero-setup default.
#   `docker compose up -d`, then in src/TripPlanner.WebApi/.env set:
#        Cache__Provider=Redis
#      and use the ConnectionStrings__Redis value already provided in .env.example.
services:
  postgres:
    image: postgres:17
    container_name: tripplanner-postgres
    environment:
      POSTGRES_USER: tripplanner
      POSTGRES_PASSWORD: tripplanner
      POSTGRES_DB: tripplanner
    ports:
      - "5432:5432"
    volumes:
      - tripplanner_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripplanner"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: tripplanner-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tripplanner_pgdata:
